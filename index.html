<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berat AI - Premium Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #06040a; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow: hidden; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(124, 58, 237, 0.1) 0%, rgba(6, 4, 10, 1) 80%); z-index: -1; }
        .ai-container { width: 100%; max-width: 450px; height: 90vh; background: rgba(15, 11, 25, 0.95); border-radius: 24px; border: 2px solid #7c3aed; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(124, 58, 237, 0.3); position: relative; }
        .ai-container::before { content: "BERAT AI CORE V3.0"; position: absolute; top: -10px; left: 24px; background: #06040a; padding: 0 8px; font-size: 0.7rem; color: #00ffcc; font-weight: 800; border: 1px solid #00ffcc; border-radius: 4px; z-index: 15; }
        .header { background: rgba(0, 0, 0, 0.4); padding: 16px; border-bottom: 1px solid rgba(124, 58, 237, 0.2); text-align: center; }
        .header h1 { font-size: 1.5rem; color: #7c3aed; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(124, 58, 237, 0.5); font-weight: 900; }
        .header p { font-size: 0.75rem; color: #00ffcc; font-weight: 700; margin-top: 2px; }
        .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { display: flex; flex-direction: column; max-width: 80%; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-meta { font-size: 0.65rem; font-weight: 800; margin-bottom: 2px; text-transform: uppercase; }
        .msg-text { padding: 10px 14px; border-radius: 4px 16px 16px 16px; font-size: 0.85rem; line-height: 1.4; }
        .msg.bot { align-self: flex-start; }
        .msg.bot .msg-meta { color: #7c3aed; margin-left: 4px; }
        .msg.bot .msg-text { background: #21163a; border: 1px solid rgba(124, 58, 237, 0.2); }
        .msg.user { align-self: flex-end; }
        .msg.user .msg-meta { align-self: flex-end; color: #00ffcc; margin-right: 4px; }
        .msg.user .msg-text { background: #162b32; border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 16px 4px 16px 16px; }
        .control-panel { padding: 14px; background: rgba(10, 7, 18, 0.95); display: flex; flex-direction: column; gap: 12px; align-items: center; border-top: 1px solid rgba(124, 58, 237, 0.2); }
        .input-row { display: flex; gap: 10px; width: 100%; align-items: center; }
        .input-box { flex: 1; background: #161024; border: 1px solid #4c2885; border-radius: 14px; padding: 12px 16px; color: #ffffff; font-size: 0.9rem; font-weight: 600; outline: none; }
        .send-btn { background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); color: white; border: none; width: 44px; height: 44px; border-radius: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(144, 97, 249, 0.3); }
        .mic-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); border: none; color: white; font-size: 1.3rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .mic-btn.listening { background: linear-gradient(135deg, #ff0055 0%, #b91c1c 100%); animation: pulseMic 1s infinite alternate; box-shadow: 0 0 20px #ff0055; }
        @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.1); } }
        .key-btn { background: transparent; color: #00ffcc; border: 1px dashed #00ffcc; padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="ai-container">
        <div class="header">
            <h1>BERAT AI</h1>
            <p id="status-line">🔑 ŞİFRE BEKLENİYOR...</p>
        </div>
        <div class="chat-area" id="chat-flow">
            <div class="msg bot">
                <div class="msg-meta">BERAT AI</div>
                <div class="msg-text">Bağlantı hazır! Google engellerini aşmak için lütfen en alttaki mor "🔑 ŞİFRE BAĞLA" butonuna tıkla ve Google AI Studio'dan aldığın şifreyi oraya yapıştır. Sonra ömür boyu kesintisiz konuşabiliriz!</div>
            </div>
        </div>
        <div class="control-panel">
            <div class="input-row">
                <input type="text" class="input-box" id="user-input" placeholder="Mesajınızı buraya yazın..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendTextMessage()">➔</button>
                <button class="mic-btn" id="mic-btn" onmousedown="startListening()" onmouseup="stopListening()" ontouchstart="startListening()" ontouchend="stopListening()">🎙️</button>
            </div>
            <button class="key-btn" onclick="setApiKey()">🔑 Şifre Bağla</button>
        </div>
    </div>
    <script>
        let savedKey = localStorage.getItem('berat_ai_secure_key') || "";
        let recognition; let isListening = false;
        
        if (savedKey) { document.getElementById('status-line').innerText = "🟢 SİSTEM: ÇİFT MOD AKTİF"; }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition(); recognition.lang = 'tr-TR'; recognition.interimResults = false; recognition.maxAlternatives = 1;
            recognition.onresult = (event) => { const text = event.results.transcript; if (text.trim()) processMessage(text); };
            recognition.onerror = () => { document.getElementById('status-line').innerText = savedKey ? "🟢 SİSTEM: ÇİFT MOD AKTİF" : "🔑 ŞİFRE BEKLENİYOR..."; document.getElementById('mic-btn').classList.remove('listening'); };
        }
        function setApiKey() {
            let key = prompt("Lütfen Google AI Studio'dan aldığın şifreyi (API Key) buraya yapıştır:", savedKey);
            if(key && key.trim()) { localStorage.setItem('berat_ai_secure_key', key.trim()); savedKey = key.trim(); document.getElementById('status-line').innerText = "🟢 SİSTEM: ÇİFT MOD AKTİF"; alert("Şifre tarayıcı hafızasına güvenle kilitlendi!"); location.reload(); }
        }
        function startListening() { if(!savedKey){alert("Lütfen önce en alttaki butondan şifrenizi bağlayın!"); return;} if (!recognition || isListening) return; isListening = true; window.speechSynthesis.cancel(); document.getElementById('mic-btn').classList.add('listening'); recognition.start(); }
        function stopListening() { if (!isListening) return; isListening = false; document.getElementById('mic-btn').classList.remove('listening'); setTimeout(() => { recognition.stop(); }, 400); }
        function sendTextMessage() { if(!savedKey){alert("Lütfen önce en alttaki butondan şifrenizi bağlayın!"); return;} const input = document.getElementById('user-input'), text = input.value.trim(); if (!text) return; input.value = ""; processMessage(text); }
        function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }
        async function processMessage(text) {
            pushLog("SİZ", text, true); document.getElementById('status-line').innerText = "⚡ SYSTEM: GENERATING RESPONSE...";
            const flow = document.getElementById('chat-flow'), loader = document.createElement('div');
            loader.className = "msg bot"; loader.id = "typing-loader"; loader.innerHTML = `<div class="msg-meta">BERAT AI</div><div class="msg-text" style="color: #9ca3af; font-style: italic;">Düşünülüyor...</div>`;
            flow.appendChild(loader); flow.scrollTop = flow.scrollHeight;
            try {
                const response = await fetch(`https://googleapis.com{savedKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text + " (Kısa, akıcı, samimi ve konuşma diline uygun cevap ver. Markdown işaretleri kullanma.)" }] }] })
                });
                const data = await response.json(); if (document.getElementById('typing-loader')) document.getElementById('typing-loader').remove();
                document.getElementById('status-line').innerText = "🟢 SİSTEM: ÇİFT MOD AKTİF";
                if (data.candidates && data.candidates.content && data.candidates.content.parts) {
                    let reply = data.candidates.content.parts.text; pushLog("BERAT AI", reply, false); speak(reply);
                } else { pushLog("BERAT AI", "Bağladığınız şifre Google tarafından reddedildi. Yeni bir şifre üretip bağlamayı deneyin.", false); }
            } catch (error) { if (document.getElementById('typing-loader')) document.getElementById('typing-loader').remove(); document.getElementById('status-line').innerText = "🔴 SYSTEM: CORE ERROR"; pushLog("BERAT AI", "Bağlantı hatası oluştu.", false); }
        }
        function speak(text) { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, '')); utterance.lang = 'tr-TR'; utterance.rate = 1.1; window.speechSynthesis.speak(utterance); } }
        function pushLog(sender, text, isUser) { const flow = document.getElementById('chat-flow'), bubble = document.createElement('div'); bubble.className = `msg ${isUser ? 'user' : 'bot'}`; bubble.innerHTML = `<div class="msg-meta">${sender}</div><div class="msg-text">${text}</div>`; flow.appendChild(bubble); flow.scrollTop = flow.scrollHeight; }
    </script>
</body>
</html>
