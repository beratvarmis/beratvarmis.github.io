    <!-- Canlı Bağlantı İçin Firebase Kütüphaneleri -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // CANLI VERİTABANI BAĞLANTISI
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const gameRef = database.ref('live_game');

        // Her girişte rastgele oyuncu adı (Gamer_123 vb.)
        const myPlayerId = "Gamer_" + Math.floor(Math.random() * 900 + 100);

        // VERİTABANINDAN CANLI VERİ GELDİĞİNDE EKRANI GÜNCELLE
        gameRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('lobby-status').innerText = "🟢 Odaya Canlı Bağlısınız (" + myPlayerId + ")";
                document.getElementById('action-owner').innerText = data.player + " tetiği çekti:";
                document.getElementById('game-result').innerText = data.result;
            } else {
                document.getElementById('lobby-status').innerText = "🟢 Oda Aktif (Tetiği Çekecek Birini Bekliyor)";
            }
        });

        // TETİK ÇEKME FONKSİYONU
        function rollNumber() {
            let finalResult = "";
            
            // %15 ihtimalle silah patlar, %85 ihtimalle boş çıkar
            const sans = Math.random();
            
            if (sans < 0.15) {
                finalResult = "💥 GÜM! ELENDİNİZ!";
            } else {
                finalResult = "🔒 *TIK*... Silah Boş Çıktı! Sıra Diğerinde.";
            }

            // Sonucu canlı veritabanına gönderiyoruz, arkadaşının ekranı da anlık değişecek
            gameRef.set({
                player: myPlayerId,
                result: finalResult,
                timestamp: Date.now()
            });
        }
    </script>
