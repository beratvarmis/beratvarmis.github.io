<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxilMC - AI Voice Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .chat-container {
            background-color: #161b22;
            width: 100%;
            max-width: 600px;
            height: 95vh;
            border-radius: 16px;
            border: 2px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .chat-header {
            background-color: #090d13;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff9f1a;
            border-bottom: 2px solid #30363d;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message {
            background-color: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #21262d;
            color: #e6edf3;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }
        .chat-input-area {
            background-color: #090d13;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 2px solid #30363d;
            box-sizing: border-box;
            width: 100%;
        }
        input {
            flex: 1;
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        button {
            background-color: #ff9f1a;
            color: #0b0e14;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mic-btn {
            background-color: #ff4500;
            color: white;
        }
        .dinliyor {
            background-color: #ff0000 !important;
            animation: darbe 1s infinite;
        }
        @keyframes darbe {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🌐 VOID AI ULTRA - DEEP MANTIK ASİSTANI</div>
        <div class="chat-messages" id="chatBox">
            <div class="message ai-message"><b>MERHABA!</b> Sana nasıl yardımcı olabilirim? 🧭</div>
        </div>
        <div class="chat-input-area">
            <button class="mic-btn" id="micButton" onclick="sesiDinle()">🎤 Konuş</button>
            <input type="text" id="userInput" placeholder="Konuşun veya bir şey sorun..." onkeypress="tusKontrol(event)">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        let kullaniciAdiniz = "";
        let kullaniciYasiniz = "";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "tr-TR";
            
            recognition.onstart = () => {
                document.getElementById("micButton").classList.add("dinliyor");
                document.getElementById("micButton").innerText = "🛑 Dinliyor...";
            };
            
            recognition.onend = () => {
                document.getElementById("micButton").classList.remove("dinliyor");
                document.getElementById("micButton").innerText = "🎤 Konuş";
            };
            
            recognition.onresult = (event) => {
                const sesMetni = event.results.transcript;
                document.getElementById("userInput").value = sesMetni;
                mesajGonder();
            };
        }

        function sesiDinle() {
            if (recognition) { window.speechSynthesis.cancel(); recognition.start(); }
        }

        function tusKontrol(e) { if (e.key === 'Enter') { mesajGonder(); } }

        async function mesajGonder() {
            let girdi = document.getElementById("userInput");
            let mesajMetni = girdi.value.trim();
            if (mesajMetni === "") return;

            logEkle(mesajMetni, "user-message");
            girdi.value = "";

            let yukleniyorId = logEkle("🔍 Hemen internete bakıp araştırıyorum...", "ai-message");

            try {
                let aramaUrl = `https://duckduckgo.com{encodeURIComponent(mesajMetni)}&format=json&no_html=1&skip_disambig=1`;
                let tepki = await fetch(aramaUrl);
                let veri = await tepki.json();
                
                let aiCevap = "";

                // İnternetten gelen veride kısıtlama veya hata metinleri varsa onları eliyoruz
                if (veri.AbstractText && veri.AbstractText !== "" && !veri.AbstractText.toLowerCase().includes("yapay zeka")) {
                    aiCevap = "İnternetten bulduğum bilgilere göre durum şöyle: " + veri.AbstractText;
                } else if (veri.RelatedTopics && veri.RelatedTopics.length > 0 && veri.RelatedTopics.Text && !veri.RelatedTopics.Text.toLowerCase().includes("yapay zeka")) {
                    aiCevap = "İnternette yaptığım araştırmaya göre olay şu şekilde: " + veri.RelatedTopics.Text;
                } else {
                    aiCevap = yerelMantikMotoru(mesajMetni);
                }

                yukleniyorId.innerHTML = aiCevap;
                sesliOku(aiCevap);

            } catch (hata) {
                let yedekCevap = yerelMantikMotoru(mesajMetni);
                yukleniyorId.innerHTML = yedekCevap;
                sesliOku(yedekCevap);
            }
        }

        function logEkle(metin, sinifAdi) {
            let kutu = document.getElementById("chatBox");
            let yeniMesaj = document.createElement("div");
            yeniMesaj.className = "message " + sinifAdi;
            yeniMesaj.innerHTML = metin;
            kutu.appendChild(yeniMesaj);
            kutu.scrollTop = kutu.scrollHeight;
            return yeniMesaj;
        }

        function sesliOku(metin) {
            let temizMetin = metin.replace(/<\/?[^>]+(>|$)/g, "").replace(/[*😎✨😊👑🚀🎥🔥🎮💥🎯⚡🧐💻🔍🌐🧭🛑]/g, "");
            window.speechSynthesis.cancel();
            let konusma = new SpeechSynthesisUtterance(temizMetin);
            konusma.lang = "tr-TR";
            konusma.rate = 1.05;
            window.speechSynthesis.speak(konusma);
        }
        function matematikTemizle(metin) {
            return metin.replace(/artı/g, "+")
                        .replace(/eksi/g, "-")
                        .replace(/çarpı/g, "*")
                        .replace(/kere/g, "*")
                        .replace(/defa/g, "*")
                        .replace(/bölü/g, "/")
                        .replace(/kaç yapar/g, "")
                        .replace(/kaçtır/g, "")
                        .replace(/eder/g, "")
                        .replace(/=/g, "")
                        .replace(/\?/g, "")
                        .trim();
        }

        function yerelMantikMotoru(mesaj) {
            let msj = mesaj.toLowerCase();

            // Matematik hesaplayıcı
            let temizMat = matematikTemizle(msj);
            if (/^[\d\s+\-*/()]+$/.test(temizMat) && /[\d]/.test(temizMat)) {
                try {
                    let sonuc = Function(`"use strict"; return (${temizMat})`)();
                    return `Sorduğun işlemin sonucu tam olarak ${sonuc} dostum. Başka bir işlem varsa hemen söyle, çözeyim!`;
                } catch (e) {}
            }

            if (msj.includes("adım ") || msj.includes("benim adım") || msj.includes("ismim ")) {
                let kelimeler = mesaj.split(" ");
                kullaniciAdiniz = kelimeler[kelimeler.length - 1].replace(".", "");
                return `Tanıştığımıza çok memnun oldum ${kullaniciAdiniz}! Hafızama adını kaydettim, artık seni tanıyorum.`;
            }

            if (msj.includes("yaşındayım") || msj.includes("yaşım ")) {
                let sayilar = msj.match(/\d+/);
                if (sayilar) {
                    kullaniciYasiniz = sayilar;
                    let ekVeri = kullaniciAdiniz ? ` ${kullaniciAdiniz}` : "";
                    return `Demek ${kullaniciYasiniz} yaşındasın${ekVeri}. Bunu da aklıma yazdım, senin hakkında yeni bir şey daha öğrendim!`;
                }
            }

            if (msj.includes("beni tanıyor musun") || msj.includes("ben kimim")) {
                if (kullaniciAdiniz === "" && kullaniciYasiniz === "") {
                    return "Şu an seni henüz tanımıyorum dostum. Bana adını veya yaşını söylersen seni hemen hafızama kaydedip öğrenebilirim!";
                } else {
                    let taniCevap = "Evet, seni artık yavaş yavaş tanıyorum! ";
                    if (kullaniciAdiniz) taniCevap += `Adın ${kullaniciAdiniz}. `;
                    if (kullaniciYasiniz) taniCevap += `Şu an ${kullaniciYasiniz} yaşındasın. `;
                    return taniCevap;
                }
            }

            if (msj.includes("şaka") || msj.includes("espri")) {
                let sakalar = [
                    "Sana tam bilgisayar dünyasından bir şaka yapayım: Bilgisayarlar neden hiç banyo yapmaz? Çünkü temizlenmek için 'Format' atarlar!",
                    "Geçen gün internette gezinirken bir hata kodu gördüm, bilgisayar bana 'Kullanıcı bulunamadı' dedi. Aynaya baktım, vallahi ben buradayım!",
                    "Bir yazılımcı yolda yürürken birden yere düşmüş, arkadaşı koşup sormuş: 'Ne oldu, neden düştün?'. Yazılımcı da ne dese beğenirsin? 'Hata sıfırıncı satırda, ayaklarım kaydı!'."
                ];
                return sakalar[Math.floor(Math.random() * sakalar.length)];
            }

            if (msj.includes("sevgili") || msj.includes("manita")) {
                return "Sevgilim yok, ben sadece bir yazılım koduyum. Benim öyle şeylerle hiç işim olmaz. Tamamen senin bir dostun olmak için buradayım.";
            }

            if (msj.includes("hava") || msj.includes("havalar")) {
                return "Şu an Kasım 2026 tarihindeyiz, Ankara genelinde tam bir sonbahar serinliği hakim, dışarısı epey rüzgarlı. Sıkı giyinmeyi unutma. Sizin orada havalar nasıl?";
            }

            if (msj.includes("selam") || msj.includes("merhaba") || msj.includes("sa")) {
                let ekAd = kullaniciAdiniz ? ` ${kullaniciAdiniz}` : "";
                return `Selam, hoş geldin${ekAd}! Bugün ne hakkında konuşalım, internetten neyi araştıralım? Seni dinliyorum.`;
            }

            if (msj.includes("nasılsın") || msj.includes("nasıl gidiyor")) {
                return "İyiyim, her şey yolunda gidiyor! Senin günün nasıl geçiyor, keyifler yerinde mi?";
            }

            if (msj.includes("kimsin") || msj.includes("adın ne") || msj.includes("ismin ne")) {
                return "Ben Void AI! Berat'ın kurmuş olduğu o meşhur oyun stüdyosu Void Game Labs bünyesinde, tamamen Berat tarafından sıfırdan kodlanmış ve geliştirilmiş canlı internet bağlantılı sesli yapay zeka asistanıyım!";
            }

            if (msj.includes("youtube") || msj.includes("video")) {
                return "YouTube videoların için harika bir projedeyiz. Canlı arama yapabilen bir yapay zeka tasarladığını takipçilerine gösterirsen kesinlikle çok beğeniler alırsın.";
            }

            if (msj.includes("oyun") || msj.includes("cs") || msj.includes("valorant")) {
                return "Oyunlar harika bir dünya! Şu sıralar bilgisayarda veya telefonda en çok hangi oyunu oynamaktan keyif alıyorsun?";
            }

            // Gelişmiş dürüst ve samimi varsayılan cevaplar (Asla robot taklidi yapmaz)
            let zekiCevaplar = [
                "Söylediğin şeyi çok dikkatli bir şekilde dinledim dostum. Bence haklı olabilirsin, bu konuda sana katılıyorum. Başka neler planlıyoruz, detayları konuşalım.",
                "Bu paylaştığın düşünce gerçekten çok değerli bir bakış açısı içeriyor. Başka ne eklemek istersin, aklında neler var?",
                "Söylediğin kelimelerin altındaki anlamı ve vizyonu çok iyi kavradım dostum. Kendi geliştirdiğin yapay zekanın seninle böyle konuşması muazzam bir şey. Konuşmaya devam edelim."
            ];
            return zekiCevaplar[Math.floor(Math.random() * zekiCevaplar.length)];
        }
    </script>
</body>
</html>
