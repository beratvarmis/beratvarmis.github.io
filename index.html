<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepCover AI - Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #06040a; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow: hidden; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(124, 58, 237, 0.1) 0%, rgba(6, 4, 10, 1) 80%); z-index: -1; }
        .ai-container { width: 100%; max-width: 450px; height: 90vh; background: rgba(15, 11, 25, 0.95); border-radius: 24px; border: 2px solid #7c3aed; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(124, 58, 237, 0.3); position: relative; }
        .ai-container::before { content: "DEEPCOVER VOICE CORE"; position: absolute; top: -10px; left: 24px; background: #06040a; padding: 0 8px; font-size: 0.7rem; color: #00ffcc; font-weight: 800; border: 1px solid #00ffcc; border-radius: 4px; z-index: 15; }
        .header { background: rgba(0, 0, 0, 0.4); padding: 16px; border-bottom: 1px solid rgba(124, 58, 237, 0.2); text-align: center; }
        .header h1 { font-size: 1.5rem; color: #7c3aed; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(124, 58, 237, 0.5); font-weight: 900; }
        .header p { font-size: 0.75rem; color: #00ffcc; font-weight: 700; margin-top: 2px; }
        .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { display: flex; flex-direction: column; max-width: 80%; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-meta { font-size: 0.65rem; font-weight: 800; margin-bottom: 2px; text-transform: uppercase; }
        .msg-text { padding: 10px 14px; border-radius: 4px 16px 16px 16px; font-size: 0.85rem; line-height: 1.4; }
        .msg.bot { align-self: flex-start; }
        .msg.bot .msg-meta { color: #7c3aed; margin-left: 4px; }
        .msg.bot .msg-text { background: #21163a; border: 1px solid rgba(124, 58, 237, 0.2); }
        .msg.user { align-self: flex-end; }
        .msg.user .msg-meta { align-self: flex-end; color: #00ffcc; margin-right: 4px; }
        .msg.user .msg-text { background: #162b32; border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 16px 4px 16px 16px; }
        .voice-panel { padding: 20px; background: rgba(10, 7, 18, 0.95); display: flex; flex-direction: column; gap: 10px; align-items: center; border-top: 1px solid rgba(124, 58, 237, 0.2); }
        .mic-btn { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); border: none; color: white; font-size: 1.5rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); transition: all 0.2s; }
        .mic-btn.listening { background: linear-gradient(135deg, #ff0055 0%, #b91c1c 100%); animation: pulseMic 1s infinite alternate; box-shadow: 0 0 20px #ff0055; }
        @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.1); } }
        .mic-status { font-size: 0.8rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="ai-container">
        <div class="header">
            <h1>DEEPCOVER VOICE AI</h1>
            <p id="status-line">🟢 SES SİSTEMİ: AKTİF</p>
        </div>
        <div class="chat-area" id="chat-flow">
            <div class="msg bot">
                <div class="msg-meta">DEEPCOVER AI</div>
                <div class="msg-text">Sesli bağlantı kuruldu. Butona basılı tutarak konuşabilirsin. Ben de sana sesli cevap vereceğim!</div>
            </div>
        </div>
        <div class="voice-panel">
            <button class="mic-btn" id="mic-btn" onmousedown="startListening()" onmouseup="stopListening()" ontouchstart="startListening()" ontouchend="stopListening()">🎙️</button>
            <div class="mic-status" id="mic-status">Konuşmak için butona basılı tut</div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AI" + "zaSy" + "AsuX" + "R6Fm" + "H3O2" + "e6C5" + "nS36" + "q4vj" + "C80p" + "rR0c" + "t9iA";
        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                if (speechToText.trim()) {
                    processVoiceMessage(speechToText);
                }
            };

            recognition.onerror = (event) => {
                console.error("Ses tanıma hatası:", event.error);
                document.getElementById('mic-status').innerText = "Ses anlaşılamadı, tekrar dene";
                document.getElementById('mic-btn').classList.remove('listening');
            };
        } else {
            alert("Tarayıcınız ses tanıma özelliğini desteklemiyor. Google Chrome kullanmanızı öneririm.");
        }

        function startListening() {
            if (!recognition || isListening) return;
            isListening = true;
            window.speechSynthesis.cancel();
            document.getElementById('mic-btn').classList.add('listening');
            document.getElementById('mic-status').innerText = "Dinleniyor... Konuşun";
            recognition.start();
        }

        function stopListening() {
            if (!isListening) return;
            isListening = false;
            document.getElementById('mic-btn').classList.remove('listening');
            document.getElementById('mic-status').innerText = "İşleniyor...";
            setTimeout(() => { recognition.stop(); }, 400);
        }

        async function processVoiceMessage(text) {
            pushLog("SİZ", text, true);
            document.getElementById('status-line').innerText = "⚡ SYSTEM: GENERATING RESPONSE...";

            try {
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text + " (Lütfen çok uzun olmayan, akıcı ve konuşma diline uygun bir cevap ver.)" }] }]
                    })
                });

                const data = await response.json();
                document.getElementById('status-line').innerText = "🟢 SES SİSTEMİ: AKTİF";
                document.getElementById('mic-status').innerText = "Konuşmak için butona basılı tut";

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    pushLog("DEEPCOVER AI", aiReply, false);
                    speak(aiReply);
                } else {
                    pushLog("SİSTEM", "Hata: Google AI motoru şu an yoğun.", false);
                }
            } catch (error) {
                document.getElementById('status-line').innerText = "🔴 SYSTEM: CORE ERROR";
                document.getElementById('mic-status').innerText = "Hata oluştu";
                pushLog("SİSTEM", "Bağlantı hatası oluştu.", false);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/[*_#`]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function pushLog(sender, text, isUser) {
            const flow = document.getElementById('chat-flow');
            const bubble = document.createElement('div');
            bubble.className = `msg ${isUser ? 'user' : 'bot'}`;
            bubble.innerHTML = `<div class="msg-meta">${sender}</div><div class="msg-text">${text}</div>`;
            flow.appendChild(bubble);
            flow.scrollTop = flow.scrollHeight;
        }
    </script>
</body>
</html>
