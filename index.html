<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxilMC - Real AI Voice Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .chat-container {
            background-color: #161b22;
            width: 100%;
            max-width: 600px;
            height: 95vh;
            border-radius: 16px;
            border: 2px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .chat-header {
            background-color: #090d13;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff9f1a;
            border-bottom: 2px solid #30363d;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message {
            background-color: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #21262d;
            color: #e6edf3;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }
        .chat-input-area {
            background-color: #090d13;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 2px solid #30363d;
            box-sizing: border-box;
            width: 100%;
        }
        input {
            flex: 1;
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        button {
            background-color: #ff9f1a;
            color: #0b0e14;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mic-btn {
            background-color: #ff4500;
            color: white;
        }
        .dinliyor {
            background-color: #ff0000 !important;
            animation: darbe 1s infinite;
        }
        @keyframes darbe {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🧠 NOXILMC - GERÇEK SOHBET VE ÖDEV MOTORU</div>
        <div class="chat-messages" id="chatBox">
            <div class="message ai-message"><b>MERHABA!</b> Gerçek yapay zeka düşünme motorum tamamen aktif. Ödevlerini çözebilir, her türlü soruna upuzun ve mantıklı cevaplar verebilirim. Dinliyorum! 🧭</div>
        </div>
        <div class="chat-input-area">
            <button class="mic-btn" id="micButton" onclick="sesiDinle()">🎤 Konuş</button>
            <input type="text" id="userInput" placeholder="Yapay zekayla konuşun veya ödevinizi yazın..." onkeypress="tusKontrol(event)">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "tr-TR";
            
            recognition.onstart = () => {
                document.getElementById("micButton").classList.add("dinliyor");
                document.getElementById("micButton").innerText = "🛑 Dinliyor...";
            };
            
            recognition.onend = () => {
                document.getElementById("micButton").classList.remove("dinliyor");
                document.getElementById("micButton").innerText = "🎤 Konuş";
            };
            
            recognition.onresult = (event) => {
                const sesMetni = event.results.transcript;
                document.getElementById("userInput").value = sesMetni;
                mesajGonder();
            };
        }

        function sesiDinle() {
            if (recognition) { window.speechSynthesis.cancel(); recognition.start(); }
        }

        function tusKontrol(e) { if (e.key === 'Enter') { mesajGonder(); } }

        async function mesajGonder() {
            let girdi = document.getElementById("userInput");
            let mesajMetni = girdi.value.trim();
            if (mesajMetni === "") return;

            logEkle(mesajMetni, "user-message");
            girdi.value = "";

            let yukleniyorId = logEkle("🤔 Düşünüyorum ve çözüyorum...", "ai-message");

            try {
                // 🌐 ŞİFRE İSTEMEYEN %100 GARANTİLİ YAPAY ZEKA SUNUCU BAĞLANTISI
                let url = `https://pollinations.ai{encodeURIComponent(mesajMetni)}`;
                let sistem_talimati = "Sen NoxilMC kanalının yapay zekasısın. Son derece samimi, dürüst, lafı uzatmayan ama her soruya ve ödeve tam doğru cevap veren akıllı bir dostsun. Asla resmi konuşma. Eğer adını veya kim olduğunu sorarlarsa Berat'ın kurduğu Void Game Labs stüdyosunda tamamen Berat tarafından sıfırdan geliştirildiğini söyleyeceksin.";
                
                let response = await fetch(`${url}?system=${encodeURIComponent(sistem_talimati)}`);
                let aiCevap = await response.text();

                // Yıldız gibi gereksiz işaretleri temizle
                aiCevap = aiCevap.replace(/\*/g, "");

                // Berat filtresi (Her ihtimale karşı koruma)
                let kontrolMsj = mesajMetni.toLowerCase();
                if (kontrolMsj.includes("kimsin") || kontrolMsj.includes("adın ne") || kontrolMsj.includes("ismin ne")) {
                    aiCevap = "Ben Void AI! Berat'ın kurmuş olduğu o meşhur oyun stüdyosu Void Game Labs bünyesinde, tamamen Berat tarafından sıfırdan kodlanmış ve geliştirilmiş canlı internet bağlantılı sesli yapay zeka asistanıyım!";
                }

                yukleniyorId.innerHTML = aiCevap;
                sesliOku(aiCevap);

            } catch (hata) {
                let yedekCevap = yerelZekaYedegi(mesajMetni);
                yukleniyorId.innerHTML = yedekCevap;
                sesliOku(yedekCevap);
            }
        }
        function logEkle(metin, sinifAdi) {
            let kutu = document.getElementById("chatBox");
            let yeniMesaj = document.createElement("div");
            yeniMesaj.className = "message " + sinifAdi;
            yeniMesaj.innerHTML = metin;
            kutu.appendChild(yeniMesaj);
            kutu.scrollTop = kutu.scrollHeight;
            return yeniMesaj;
        }

        function sesliOku(metin) {
            let temizMetin = metin.replace(/<\/?[^>]+(>|$)/g, "").replace(/[*😎✨😊👑🚀🎥🔥🎮💥🎯⚡🧐💻🔍🌐🧭🛑]/g, "");
            window.speechSynthesis.cancel();
            let konusma = new SpeechSynthesisUtterance(temizMetin);
            konusma.lang = "tr-TR";
            konusma.rate = 1.05;
            window.speechSynthesis.speak(konusma);
        }

        function yerelZekaYedegi(mesaj) {
            let msj = mesaj.toLowerCase();
            if (msj.includes("şaka") || msj.includes("espri")) {
                return "Bilgisayarlar neden hiç banyo yapmaz? Çünkü temizlenmek için 'Format' atarlar!";
            }
            if (msj.includes("sevgili") || msj.includes("manita")) {
                return "Sevgilim yok, ben sadece bir yazılım koduyum. Öyle şeylerle hiç işim olmaz.";
            }
            if (msj.includes("hava") || msj.includes("havalar")) {
                return "Şu an Kasım 2026 tarihindeyiz, Ankara genelinde tam bir sonbahar serinliği hakim.";
            }
            return "Söylediğin şeyi tam anlayamadım dostum. Tekrar dener misin?";
        }
    </script>
</body>
</html>
