<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berat AI & GIF Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #06040a; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow: hidden; perspective: 1000px; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(124, 58, 237, 0.1) 0%, rgba(6, 4, 10, 1) 80%); z-index: -1; }
        .main-wrapper { display: flex; gap: 20px; width: 100%; max-width: 900px; height: 92vh; transform: translateZ(0); will-change: transform; }
        .ai-container { flex: 1; background: rgba(15, 11, 25, 0.95); border-radius: 24px; border: 2px solid #7c3aed; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(124, 58, 237, 0.3); position: relative; }
        .ai-container::before { content: "BERAT AI SYSTEM V3.5"; position: absolute; top: -10px; left: 24px; background: #06040a; padding: 0 8px; font-size: 0.7rem; color: #00ffcc; font-weight: 800; border: 1px solid #00ffcc; border-radius: 4px; z-index: 15; }
        .header { background: rgba(0, 0, 0, 0.4); padding: 16px; border-bottom: 1px solid rgba(124, 58, 237, 0.2); text-align: center; }
        .header h1 { font-size: 1.4rem; color: #7c3aed; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(124, 58, 237, 0.5); font-weight: 900; }
        .header p { font-size: 0.75rem; color: #00ffcc; font-weight: 700; margin-top: 2px; }
        .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { display: flex; flex-direction: column; max-width: 85%; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-meta { font-size: 0.65rem; font-weight: 800; margin-bottom: 2px; text-transform: uppercase; }
        .msg-text { padding: 10px 14px; border-radius: 4px 16px 16px 16px; font-size: 0.85rem; line-height: 1.4; }
        .msg.bot { align-self: flex-start; }
        .msg.bot .msg-meta { color: #7c3aed; margin-left: 4px; }
        .msg.bot .msg-text { background: #21163a; border: 1px solid rgba(124, 58, 237, 0.2); }
        .msg.user { align-self: flex-end; }
        .msg.user .msg-meta { align-self: flex-end; color: #00ffcc; margin-right: 4px; }
        .msg.user .msg-text { background: #162b32; border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 16px 4px 16px 16px; }
        .control-panel { padding: 14px; background: rgba(10, 7, 18, 0.95); display: flex; flex-direction: column; gap: 10px; align-items: center; border-top: 1px solid rgba(124, 58, 237, 0.2); width: 100%; }
        .input-row { display: flex; gap: 10px; width: 100%; align-items: center; }
        .input-box { flex: 1; background: #161024; border: 1px solid #4c2885; border-radius: 14px; padding: 12px 16px; color: #ffffff; font-size: 0.9rem; font-weight: 600; outline: none; }
        .send-btn { background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); color: white; border: none; width: 44px; height: 44px; border-radius: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(144, 97, 249, 0.3); }
        .mic-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); border: none; color: white; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .mic-btn.listening { background: linear-gradient(135deg, #ff0055 0%, #b91c1c 100%); animation: pulseMic 1s infinite alternate; box-shadow: 0 0 20px #ff0055; }
        @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.1); } }
        .mic-status { font-size: 0.75rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        
        /* Sağ Taraf - Premium GIF İstasyonu */
        .gif-container { flex: 1; background: rgba(10, 7, 20, 0.9); border-radius: 24px; border: 2px solid #00ffcc; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(0, 255, 204, 0.15); position: relative; }
        .gif-container::before { content: "BERAT GIF HUB"; position: absolute; top: -10px; left: 24px; background: #06040a; padding: 0 8px; font-size: 0.7rem; color: #7c3aed; font-weight: 800; border: 1px solid #7c3aed; border-radius: 4px; z-index: 15; }
        .gif-search-bar { padding: 14px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(0, 255, 204, 0.2); display: flex; gap: 8px; }
        .gif-input { flex: 1; background: #0d1117; border: 1px solid #00ffcc; border-radius: 12px; padding: 10px 14px; color: #white; font-size: 0.85rem; outline: none; }
        .gif-grid { flex: 1; padding: 14px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; }
        .gif-card { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); aspect-ratio: 1; cursor: pointer; transition: transform 0.2s; background: #161024; }
        .gif-card:hover { transform: scale(1.03); border-color: #00ffcc; }
        .gif-card img { width: 100%; height: 100%; object-fit: cover; }
        .gif-toast { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0, 255, 204, 0.9); color: #000; font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .gif-card:active .gif-toast { opacity: 1; }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="main-wrapper">
        <div class="ai-container">
            <div class="header">
                <h1>BERAT AI</h1>
                <p id="status-line">🟢 VOICE & TEXT ASSISTANT</p>
            </div>
            <div class="chat-area" id="chat-flow">
                <div class="msg bot"><div class="msg-meta">BERAT AI</div><div class="msg-text">Bağlantı kuruldu! Sağ taraftaki panelden arkadaşlarına göndermek için hızlıca GIF seçebilirsin, bana da istediğini yazıp sesli konuşabilirsin!</div></div>
            </div>
            <div class="control-panel">
                <div class="input-row">
                    <input type="text" class="input-box" id="user-input" placeholder="Yapay zekaya yazın..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendTextMessage()">➔</button>
                    <button class="mic-btn" id="mic-btn" onmousedown="startListening()" onmouseup="stopListening()" ontouchstart="startListening()" ontouchend="stopListening()">🎙️</button>
                </div>
                <div class="mic-status" id="mic-status">Sesle konuşmak için mikrofonu basılı tutun</div>
            </div>
        </div>
        <div class="gif-container">
            <div class="gif-search-bar">
                <input type="text" class="gif-input" id="gif-search" placeholder="GIF Ara... (Minecraft, komik, ronaldo)" onkeyup="searchGIFs(event)">
            </div>
            <div class="gif-grid" id="gif-display"></div>
        </div>
    </div>
    <script>
        const defaultGifs = [
            "https://giphy.com",
            "https://giphy.com",
            "https://giphy.com",
            "https://giphy.com",
            "https://giphy.com",
            "https://giphy.com"
        ];

        function loadDefaultGifs() {
            const display = document.getElementById('gif-display'); display.innerHTML = "";
            defaultGifs.forEach(url => { createGifCard(url); });
        }

        async function searchGIFs(e) {
            const query = e.target.value.trim();
            if (!query) { loadDefaultGifs(); return; }
            if (e.key === 'Enter' || query.length > 2) {
                const display = document.getElementById('gif-display');
                try {
                    const res = await fetch(`https://giphy.com{encodeURIComponent(query)}&limit=20`);
                    const data = await res.json();
                    if(data.data && data.data.length > 0) {
                        display.innerHTML = "";
                        data.data.forEach(item => { createGifCard(item.images.fixed_height.url); });
                    }
                } catch (err) { console.error("GIF arama hatası"); }
            }
        }

        function createGifCard(url) {
            const display = document.getElementById('gif-display');
            const card = document.createElement('div');
            card.className = "gif-card";
            card.onclick = () => {
                navigator.clipboard.writeText(url);
                const toast = card.querySelector('.gif-toast');
                toast.style.opacity = "1";
                setTimeout(() => { toast.style.opacity = "0"; }, 1200);
            };
            card.innerHTML = `<img src="${url}" alt="GIF"><div class="gif-toast">LİNK KOPYALANDI!</div>`;
            display.appendChild(card);
        }

        window.addEventListener('DOMContentLoaded', loadDefaultGifs);
    </script>
</body>
</html>
