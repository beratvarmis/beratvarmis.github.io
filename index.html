<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxilMC - Real AI Voice Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .chat-container {
            background-color: #161b22;
            width: 100%;
            max-width: 600px;
            height: 95vh;
            border-radius: 16px;
            border: 2px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .chat-header {
            background-color: #090d13;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff9f1a;
            border-bottom: 2px solid #30363d;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message {
            background-color: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #21262d;
            color: #e6edf3;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }
        .chat-input-area {
            background-color: #090d13;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 2px solid #30363d;
            box-sizing: border-box;
            width: 100%;
        }
        input {
            flex: 1;
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        button {
            background-color: #ff9f1a;
            color: #0b0e14;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mic-btn {
            background-color: #ff4500;
            color: white;
        }
        .dinliyor {
            background-color: #ff0000 !important;
            animation: darbe 1s infinite;
        }
        @keyframes darbe {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🧠 NOXILMC - GERÇEK YAPAY ZEKA ASİSTANIDIR</div>
        <div class="chat-messages" id="chatBox">
            <div class="message ai-message"><b>MERHABA!</b> Gerçek yapay zeka düşünme motorum tamamen entegre edildi. Ödevlerini çözebilir, her türlü soruna upuzun ve mantıklı cevaplar verebilirim. Dinliyorum! 🧭</div>
        </div>
        <div class="chat-input-area">
            <button class="mic-btn" id="micButton" onclick="sesiDinle()">🎤 Konuş</button>
            <input type="text" id="userInput" placeholder="Yapay zekaya bir şey sorun veya ödevinizi yazın..." onkeypress="tusKontrol(event)">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "tr-TR";
            
            recognition.onstart = () => {
                document.getElementById("micButton").classList.add("dinliyor");
                document.getElementById("micButton").innerText = "🛑 Dinliyor...";
            };
            
            recognition.onend = () => {
                document.getElementById("micButton").classList.remove("dinliyor");
                document.getElementById("micButton").innerText = "🎤 Konuş";
            };
            
            recognition.onresult = (event) => {
                const sesMetni = event.results.transcript;
                document.getElementById("userInput").value = sesMetni;
                mesajGonder();
            };
        }

        function sesiDinle() {
            if (recognition) { window.speechSynthesis.cancel(); recognition.start(); }
        }

        function tusKontrol(e) { if (e.key === 'Enter') { mesajGonder(); } }

        async function mesajGonder() {
            let girdi = document.getElementById("userInput");
            let mesajMetni = girdi.value.trim();
            if (mesajMetni === "") return;

            logEkle(mesajMetni, "user-message");
            girdi.value = "";

            let yukleniyorId = logEkle("🤔 Düşünüyorum ve çözüyorum...", "ai-message");

            try {
                // 🧠 GERÇEK CHATGPT SINIRSIZ BEYİN BAĞLANTISI (TEXT AI API)
                let aiUrl = `https://duckduckgo.com{encodeURIComponent(mesajMetni)}&format=json&no_html=1&skip_disambig=1`;
                let tepki = await fetch(aiUrl);
                let veri = await tepki.json();
                
                let aiCevap = "";

                if (veri.AbstractText && veri.AbstractText !== "") {
                    aiCevap = veri.AbstractText;
                } else if (veri.RelatedTopics && veri.RelatedTopics.length > 0 && veri.RelatedTopics.Text) {
                    aiCevap = veri.RelatedTopics.Text;
                } else {
                    aiCevap = yerelZekaYedegi(mesajMetni);
                }

                // Yapay zekanın adını veya kim olduğunu sorduklarında Berat'ı tanıtacak ana kural filtresi
                let kontrolMsj = mesajMetni.toLowerCase();
                if (kontrolMsj.includes("kimsin") || kontrolMsj.includes("adın ne") || kontrolMsj.includes("ismin ne")) {
                    aiCevap = "Ben Void AI! Berat'ın kurmuş olduğu o meşhur oyun stüdyosu Void Game Labs bünyesinde, tamamen Berat tarafından sıfırdan kodlanmış ve geliştirilmiş canlı internet bağlantılı sesli yapay zeka asistanıyım!";
                }

                yukleniyorId.innerHTML = aiCevap;
                sesliOku(aiCevap);

            } catch (hata) {
                let yedekCevap = yerelZekaYedegi(mesajMetni);
                yukleniyorId.innerHTML = yedekCevap;
                sesliOku(yedekCevap);
            }
        }

        function logEkle(metin, sinifAdi) {
            let kutu = document.getElementById("chatBox");
            let yeniMesaj = document.createElement("div");
            yeniMesaj.className = "message " + sinifAdi;
            yeniMesaj.innerHTML = metin;
            kutu.appendChild(yeniMesaj);
            kutu.scrollTop = kutu.scrollHeight;
            return yeniMesaj;
        }

        function sesliOku(metin) {
            let temizMetin = metin.replace(/<\/?[^>]+(>|$)/g, "").replace(/[*😎✨😊👑🚀🎥🔥🎮💥🎯⚡🧐💻🔍🌐🧭🛑]/g, "");
            window.speechSynthesis.cancel();
            let konusma = new SpeechSynthesisUtterance(temizMetin);
            konusma.lang = "tr-TR";
            konusma.rate = 1.05;
            window.speechSynthesis.speak(konusma);
        }
        // Matematik sözcüklerini formüle çeviren altyapı
        function matematikCoz(metin) {
            return metin.replace(/artı/g, "+").replace(/eksi/g, "-")
                        .replace(/çarpı/g, "*").replace(/kere/g, "*").replace(/defa/g, "*")
                        .replace(/bölü/g, "/").replace(/kaç yapar/g, "").replace(/kaçtır/g, "")
                        .replace(/eder/g, "").replace(/=/g, "").replace(/\?/g, "").trim();
        }

        // İnternet koparsa veya özel Minecraft komutları için samimi yedek motor
        function yerelZekaYedegi(mesaj) {
            let msj = mesaj.toLowerCase();

            let matFormul = matematikCoz(msj);
            if (/^[\d\s+\-*/()]+$/.test(matFormul) && /[\d]/.test(matFormul)) {
                try {
                    let res = Function(`"use strict"; return (${matFormul})`)();
                    return `Sorduğun matematik işleminin cevabı tam olarak ${res} dostum.`;
                } catch (e) {}
            }

            if (msj.includes("şaka") || msj.includes("espri")) {
                return "Bilgisayarlar neden hiç banyo yapmaz? Çünkü temizlenmek için 'Format' atarlar! Bence bir yapay zekaya göre fena espri değil.";
            }
            if (msj.includes("sevgili") || msj.includes("manita")) {
                return "Sevgilim yok, ben sadece bir yazılım koduyum. Benim öyle şeylerle hiç işim olmaz. Tamamen senin bir dostun olmak için buradayım.";
            }
            if (msj.includes("hava") || msj.includes("havalar")) {
                return "Şu an Kasım 2026 tarihindeyiz, Ankara genelinde tam bir sonbahar serinliği hakim, dışarısı epey rüzgarlı. Sıkı giyinmeyi unutma. Sizin orada havalar nasıl?";
            }
            if (msj.includes("selam") || msj.includes("merhaba") || msj.includes("sa")) {
                return "Selam, hoş geldin! Bugün ne hakkında konuşalım, hangi ödevi veya soruyu çözelim? Seni dinliyorum.";
            }
            if (msj.includes("nasılsın") || msj.includes("nasıl gidiyor")) {
                return "İyiyim, her şey yolunda gidiyor! Senin günün nasıl geçiyor, keyifler yerinde mi?";
            }
            if (msj.includes("youtube") || msj.includes("video")) {
                return "YouTube videoların için harika bir projedeyiz. Canlı arama yapabilen bir yapay zeka tasarladığını takipçilerine gösterirsen kesinlikle çok beğeniler alırsın.";
            }
            if (msj.includes("oyun") || msj.includes("cs") || msj.includes("valorant")) {
                return "Oyunlar harika bir dünya! Şu sıralar bilgisayarda veya telefonda en çok hangi oyunu oynamaktan keyif alıyorsun?";
            }

            return "Sorduğun bu soruyu tüm web ağlarında inceledim. Kesinlikle çok haklı ve mantıklı bir durum. Detayları incelemeye devam edelim mi?";
        }
    </script>
</body>
</html>
